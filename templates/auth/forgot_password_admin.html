<!doctype html>
<html lang="{{ 'my' if (lang or 'my') == 'my' else 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t('forgot_admin_title') }} — PUMUB LibInfoBot</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
  <div class="auth-navrow">
    <a href="{{ url_for('home') }}" class="auth-brand"><span class="auth-brand-mark"><i class="bi bi-book-half"></i></span><span><span class="auth-brand-name">{{ t('auth_brand_name') }}</span><span class="auth-brand-sub">{{ t('auth_brand_sub') }}</span></span></a>
    <div class="auth-lang" role="group" aria-label="{{ t('lang_title') }}">
      <a href="{{ url_for('auth.set_language', language='my', redirect='/auth/forgot-password') }}" {% if lang == 'my' %}class="is-active"{% endif %}>{{ t('lang_switch_my') }}</a><span class="auth-lang-sep">|</span><a href="{{ url_for('auth.set_language', language='en', redirect='/auth/forgot-password') }}" {% if lang == 'en' %}class="is-active"{% endif %}>{{ t('lang_switch_en') }}</a>
    </div>
  </div>
  <div class="auth-wrapper"><div class="auth-card" style="max-width:480px;">
    <div class="auth-body text-center">
      <div class="mb-3" style="font-size:3rem;color:#0e766f"><i class="bi bi-person-lock"></i></div>
      <h1 class="h3 mb-3">{{ t('forgot_admin_title') }}</h1>
      <p class="text-muted" style="line-height:1.8">{{ t('forgot_admin_notice') }}</p>
      <div class="alert alert-info text-start small"><i class="bi bi-info-circle me-1"></i>{{ t('forgot_admin_steps') }}</div>
      <a class="btn auth-btn mt-2" href="{{ url_for('auth.login') }}"><i class="bi bi-arrow-left me-1"></i>{{ t('fp_back_login') }}</a>
    </div>
  </div></div>
</body>
</html>
