{% if session.get('user_id') and session.get('role') != 'admin' %}
<div class="libinfobot" data-libinfobot data-libinfobot-copy='{{ {"untitled": t("widget_untitled_book"), "author": t("widget_author_unavailable"), "category": t("widget_category"), "availability": t("widget_availability"), "available": t("widget_available"), "unavailable": t("widget_unavailable"), "view_details": t("widget_view_details"), "copy_summary": t("widget_copy_summary"), "summary_copied": t("widget_summary_copied"), "pdf_summary_title": t("widget_pdf_summary_title"), "ask_book": t("widget_ask_book"), "pdf_summary": t("widget_pdf_summary"), "ask_pdf": t("widget_ask_pdf"), "error": t("widget_error"), "no_answer": t("widget_no_answer"), "no_book": t("widget_no_book"), "clear_history": t("widget_clear_history"), "clear_confirm": t("widget_clear_confirm"), "clear_done": t("widget_clear_done")}|tojson }}'>
    <button class="libinfobot-launcher" type="button" data-libinfobot-toggle aria-controls="libinfobot-panel" aria-expanded="false" aria-label="{{ t('widget_open') }}">
        <span class="libinfobot-avatar" aria-hidden="true"><img src="{{ url_for('static', filename='images/pumub-libinfobot-logo.png') }}" alt=""></span>
        <span class="libinfobot-launcher-label">{{ t('widget_ask') }}</span>
    </button>

    <section class="libinfobot-panel" id="libinfobot-panel" data-libinfobot-panel hidden aria-label="{{ t('widget_chat') }}">
        <header class="libinfobot-header">
            <div class="libinfobot-identity">
                <span class="libinfobot-avatar" aria-hidden="true"><img src="{{ url_for('static', filename='images/pumub-libinfobot-logo.png') }}" alt=""></span>
                <div>
                    <strong>LibInfoBot</strong>
                    <small><span class="libinfobot-status-dot"></span> {{ t('widget_assistant') }}</small>
                </div>
            </div>
                        <div class="libinfobot-header-actions">
                <button class="libinfobot-clear" type="button" data-libinfobot-clear aria-label="{{ t('widget_clear_history') }}" title="{{ t('widget_clear_history') }}"><i class="bi bi-trash3" aria-hidden="true"></i><span class="visually-hidden">{{ t('widget_clear_history') }}</span></button>
                <button class="libinfobot-close" type="button" data-libinfobot-toggle aria-label="{{ t('widget_minimize') }}"><i class="bi bi-dash-lg"></i></button>
            </div>

        </header>

        <div class="libinfobot-messages" data-libinfobot-messages aria-live="polite">
            <div class="libinfobot-message bot">
                <span class="libinfobot-message-avatar" aria-hidden="true"><img src="{{ url_for('static', filename='images/pumub-libinfobot-logo.png') }}" alt=""></span>
                <div class="libinfobot-bubble">{{ t('widget_greeting')|safe }}</div>
            </div>
            <div class="libinfobot-quick-actions" aria-label="{{ t('widget_quick_actions') }}">
                <button type="button" class="libinfobot-quick-action" data-libinfobot-quick data-question="{{ t('widget_quick_search_question') }}"><i class="bi bi-search" aria-hidden="true"></i>{{ t('widget_quick_search') }}</button>
                <button type="button" class="libinfobot-quick-action" data-libinfobot-quick data-question="{{ t('widget_quick_recommend_question') }}"><i class="bi bi-stars" aria-hidden="true"></i>{{ t('widget_quick_recommend') }}</button>
                <button type="button" class="libinfobot-quick-action" data-libinfobot-quick data-question="{{ t('widget_quick_pdf_question') }}"><i class="bi bi-file-earmark-text" aria-hidden="true"></i>{{ t('widget_quick_pdf') }}</button>
            </div>
        </div>

        <div class="libinfobot-typing" data-libinfobot-typing hidden><span></span><span></span><span></span><em>{{ t('widget_thinking') }}</em></div>
        <div class="libinfobot-error" data-libinfobot-error role="alert" hidden></div>
        <form class="libinfobot-form" data-libinfobot-form>
            <label class="visually-hidden" for="libinfobot-input">{{ t('widget_message_label') }}</label>
            <textarea id="libinfobot-input" data-libinfobot-input rows="1" maxlength="2000" placeholder="{{ t('widget_placeholder') }}"></textarea>
            <button type="submit" data-libinfobot-send aria-label="{{ t('widget_send') }}"><i class="bi bi-send-fill"></i></button>
        </form>
        <p class="libinfobot-disclaimer">{{ t('widget_disclaimer') }}</p>
    </section>
</div>
{% endif %}
